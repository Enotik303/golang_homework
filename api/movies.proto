syntax = "proto3";

package movies.v1;

option go_package = "movieservice/gen/moviepb;moviepb";

service MovieService {
  rpc LoadMovies(LoadMoviesRequest) returns (LoadMoviesResponse);
  rpc GetLastMovie(GetLastMovieRequest) returns (Movie);
}

message Movie {
  int32 id = 1;
  string title = 2;
  int32 year = 3;
  string director = 4;
}

message LoadMoviesRequest {
  int32 from = 1;
  int32 to = 2;
}
message LoadError {
  int32 id = 1;
  string message = 2;
}

message LoadMoviesResponse {
  repeated Movie movies = 1;
  repeated LoadError errors = 2;
}

message GetLastMovieRequest {}
